- name: Configure axvm (Lumma ClickFix DFIR analyst workstation)
  hosts: axvm
  gather_facts: false
  become: true
  pre_tasks:
    - name: Wait for SSH to accept connections
      ansible.builtin.wait_for_connection:
        delay: 0
        sleep: 10
        timeout: 900
  roles:
    - role: ansible-role-user-access
      user_access_username: analyst
      user_access_password: Password123!
      user_access_admin: True
  tasks:
    - name: Grant analyst unrestricted sudo (NOPASSWD ALL)
      ansible.builtin.copy:
        dest: /etc/sudoers.d/analyst
        content: "analyst ALL=(ALL) NOPASSWD:ALL\n"
        owner: root
        group: root
        mode: "0440"
        validate: /usr/sbin/visudo -cf %s

    - name: Install DFIR analyst tooling
      ansible.builtin.apt:
        name:
          - curl
          - wget
          - git
          - unzip
          - jq
          - less
          - xxd
          - terminator
          - python3
        state: present
        update_cache: true

    - name: Ensure evidence directory exists
      ansible.builtin.file:
        path: "{{ lab_evidence_dest }}"
        state: directory
        owner: analyst
        group: analyst
        mode: "0755"

    - name: Copy the evidence artefacts into the analyst home
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../evidence/"
        dest: "{{ lab_evidence_dest }}/"
        owner: analyst
        group: analyst
        mode: preserve

    - name: Drop analyst welcome banner
      ansible.builtin.copy:
        dest: /etc/motd
        owner: root
        group: root
        mode: "0644"
        content: |
          ================================================================
           BTCM-16 Lumma ClickFix — DFIR analyst workstation (axvm)
          ================================================================
           Login    : analyst / Password123!
           Evidence : {{ lab_evidence_dest }}
          ================================================================

- name: Disable unattended apt upgrades
  hosts: all
  gather_facts: false
  become: true
  tasks:
    - name: Disable unattended upgrades in apt periodic config
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        owner: root
        group: root
        mode: "0644"
        content: |
          APT::Periodic::Update-Package-Lists "0";
          APT::Periodic::Unattended-Upgrade "0";

    - name: Disable apt daily timers
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: stopped
        enabled: false
        masked: true
      loop:
        - apt-daily.timer
        - apt-daily-upgrade.timer
